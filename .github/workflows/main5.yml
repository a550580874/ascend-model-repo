name: Scheduled Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape_job:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests PyYAML

      - name: Run Scraper
        id: get_json
        run: python get_data_from_gitcode.py

      - name: Copy downloaded json into repo
        run: |
          mkdir -p data
          cp "${{ steps.get_json.outputs.json_path }}" data/ascend_model_with_adapter.json
          ls -la data
          test -f data/ascend_model_with_adapter.json

      - name: Commit and Push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action Bot"

          git add data/ascend_model_with_adapter.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-update ascend model data: $(date)"
          git push
