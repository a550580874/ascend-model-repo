name: Merge Total Models

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  merge-total-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build merged total model file
        run: python merge_total_models.py

      - name: Assign synthetic IDs and rebuild indexes
        run: python build_model_source_keywords.py

      - name: Commit and push updates
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action Bot"

          git add data/ascend_model_with_adapter-1-total.json \
                  data/ascend_model_source_key_word.json \
                  data/ascend_mode_source_model_name.json \
                  data/ascend_model_source_framework.json \
                  data/ascend_model_source_hardware.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-update merged total model data: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
